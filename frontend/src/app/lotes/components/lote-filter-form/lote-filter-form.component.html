<mat-expansion-panel class="filter-panel" expanded>
  <mat-expansion-panel-header>
    <mat-panel-title>Filtros</mat-panel-title>
    <mat-panel-description>Pesquisar lotes e refinar resultados</mat-panel-description>
  </mat-expansion-panel-header>

  <form [formGroup]="form" class="filter-form" (ngSubmit)="search()">
    <div class="filter-grid">
      <mat-form-field appearance="outline">
        <mat-label>Código do Lote</mat-label>
        <input matInput formControlName="codigoLote" placeholder="Ex: LOT-0001" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Situação</mat-label>
        <mat-select formControlName="situacao">
          <mat-option *ngFor="let situacao of situacoes" [value]="situacao">
            {{ situacao }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="range-row">
        <mat-form-field appearance="outline">
          <mat-label>Valor Mínimo</mat-label>
          <input matInput type="number" formControlName="valorMinimo" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Valor Máximo</mat-label>
          <input matInput type="number" formControlName="valorMaximo" />
        </mat-form-field>
      </div>

      <div class="range-row">
        <mat-form-field appearance="outline">
          <mat-label>Data Início</mat-label>
          <input matInput [matDatepicker]="startDatePicker" formControlName="dataInicio" />
          <mat-datepicker-toggle matSuffix [for]="startDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #startDatePicker></mat-datepicker>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Data Fim</mat-label>
          <input matInput [matDatepicker]="endDatePicker" formControlName="dataFim" />
          <mat-datepicker-toggle matSuffix [for]="endDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #endDatePicker></mat-datepicker>
        </mat-form-field>
      </div>
    </div>

    <div class="filter-actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Pesquisar</button>
      <button mat-stroked-button type="button" (click)="clear()">Limpar</button>
    </div>

    <p *ngIf="form.hasError('rangeInvalid')" class="range-error">
      Os valores ou datas estão incorretos. Verifique a faixa "De <= Até".
    </p>
  </form>
</mat-expansion-panel>
